<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#1a2332"/>
    </linearGradient>
    <linearGradient id="gr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff88"/>
      <stop offset="100%" style="stop-color:#00c8ff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="100" height="100" rx="20" fill="url(#bg)"/>
  <rect x="8" y="8" width="84" height="84" rx="14" fill="none" stroke="url(#gr)" stroke-width="1.5" opacity="0.4"/>
  <!-- Terminal prompt -->
  <text x="14" y="42" font-family="monospace" font-size="22" font-weight="700" fill="url(#gr)" filter="url(#glow)">~$</text>
  <!-- Cursor blink block -->
  <rect x="52" y="24" width="13" height="22" rx="2" fill="url(#gr)" opacity="0.9" filter="url(#glow)"/>
  <!-- Decorative lines -->
  <line x1="14" y1="52" x2="86" y2="52" stroke="url(#gr)" stroke-width="0.8" opacity="0.25"/>
  <rect x="14" y="60" width="30" height="3" rx="1.5" fill="#00ff88" opacity="0.5"/>
  <rect x="14" y="68" width="50" height="3" rx="1.5" fill="#00c8ff" opacity="0.35"/>
  <rect x="14" y="76" width="22" height="3" rx="1.5" fill="#00ff88" opacity="0.25"/>
  <!-- Node dots -->
  <circle cx="80" cy="64" r="3" fill="#00ff88" opacity="0.6" filter="url(#glow)"/>
  <circle cx="80" cy="74" r="2" fill="#00c8ff" opacity="0.5"/>
  <circle cx="80" cy="82" r="1.5" fill="#ff6b35" opacity="0.6"/>
</svg>
